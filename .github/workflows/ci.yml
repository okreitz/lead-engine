name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build engine image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: engine
          push: false
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: false
      - name: Validate compose file
        run: LE_MASTER_KEY=ci LE_SETUP_TOKEN=ci docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml config -q
