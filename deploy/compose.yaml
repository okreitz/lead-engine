# Lead Engine stack: Coolify's Docker Compose build pack, or locally with
#   docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml up --build
#
# No ports are published here; Coolify's proxy routes the domains you assign
# (see deploy/coolify.md):
#   - app domain       -> web:4500    (login required on every page and API route)
#   - collector domain -> engine:4511 (Phase 3; the only public, unauthenticated surface)
# The engine API (:4501) is reached only by the web container over the internal network.
#
# `${VAR:?}` marks a variable Coolify requires before it deploys. Never commit values.
name: lead-engine

services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: engine
    image: lead-engine-engine
    restart: unless-stopped
    environment:
      LE_LOG_LEVEL: ${LE_LOG_LEVEL:-info}
      # 32 bytes, base64 (`openssl rand -base64 32`). Encrypts workspace provider keys.
      LE_MASTER_KEY: ${LE_MASTER_KEY:?}
      # Needed once, to create the first user (the container binds 0.0.0.0).
      LE_SETUP_TOKEN: ${LE_SETUP_TOKEN:?}
      LE_COOKIE_SECURE: ${LE_COOKIE_SECURE:-auto}
      # Optional instance fallback for the anthropic-api adapter; workspace keys win.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - le-data:/data
    expose:
      - '4501'
      - '4511'
    mem_limit: 256m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4501/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: lead-engine-web
    restart: unless-stopped
    environment:
      LE_ENGINE_URL: http://engine:4501
    expose:
      - '4500'
    depends_on:
      engine:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4500/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  # SQLite database (WAL) and later the .mmdb files. Back this volume up.
  le-data:
