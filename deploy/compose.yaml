# Lead Engine stack: Coolify's Docker Compose build pack, or locally with
#   docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml up --build
#
# No ports are published here; Coolify's proxy routes the domains you assign
# (see deploy/coolify.md):
#   - app domain       -> web:4500    (login required on every page and API route)
#   - collector domain -> engine:4511 (the only public, unauthenticated surface)
# The engine API (:4501) is reached only by the web container over the internal network;
# never give the engine a domain on port 4501.
#
# `${VAR:?}` marks a variable Coolify requires before it deploys. Never commit values.
name: lead-engine

services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: engine
    image: lead-engine-engine
    restart: unless-stopped
    environment:
      LE_LOG_LEVEL: ${LE_LOG_LEVEL:-info}
      # 32 bytes, base64 (`openssl rand -base64 32`). Encrypts workspace provider keys.
      LE_MASTER_KEY: ${LE_MASTER_KEY:?}
      # Needed once, to create the first user (the container binds 0.0.0.0).
      LE_SETUP_TOKEN: ${LE_SETUP_TOKEN:?}
      LE_COOKIE_SECURE: ${LE_COOKIE_SECURE:-auto}
      # Optional instance fallback for the anthropic-api adapter; workspace keys win.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # SEC EDGAR needs a declared contact User-Agent, e.g. "Lead Engine admin@yourdomain.com".
      LE_SEC_USER_AGENT: ${LE_SEC_USER_AGENT:-}
      # Email verification through the Reacher sidecar: off until the VPS port 25 test passes.
      # To enable: LE_REACHER=on and a LE_REACHER_SECRET, and run deploy/compose.reacher.yaml next to
      # this stack (see deploy/coolify.md). Reacher is never part of this file.
      LE_REACHER: ${LE_REACHER:-off}
      LE_REACHER_URL: http://reacher:8080
      LE_REACHER_SECRET: ${LE_REACHER_SECRET:-}
      # Optional: ProjectDiscovery httpx for technographics (not shipped in the image).
      LE_HTTPX_BIN: ${LE_HTTPX_BIN:-}
      # Stream 1 collector: the public URL used in the snippet, e.g. https://collect.example.com
      # (the domain you give the engine service on port 4511).
      LE_COLLECTOR_URL: ${LE_COLLECTOR_URL:-}
      # Coolify's Traefik sets X-Real-Ip to the visitor's address (it drops any value a client
      # sends). Change only behind a different proxy.
      LE_CLIENT_IP_HEADER: ${LE_CLIENT_IP_HEADER:-x-real-ip}
      # Optional: IPinfo Lite (CC BY-SA) instead of DB-IP Lite. Downloaded at runtime into
      # /data/geo, never part of the image.
      LE_IPINFO_TOKEN: ${LE_IPINFO_TOKEN:-}
      # Stream 2: the Bluesky Jetstream connection, open only while a workspace has an approved
      # offer with Bluesky on. Empty means on; set "off" to never connect.
      LE_BLUESKY: ${LE_BLUESKY:-}
    volumes:
      - le-data:/data
    expose:
      - '4501'
      - '4511'
    mem_limit: 256m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4501/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: lead-engine-web
    restart: unless-stopped
    environment:
      LE_ENGINE_URL: http://engine:4501
    expose:
      - '4500'
    depends_on:
      engine:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4500/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  # SQLite database (WAL), dataset downloads (imports/) and the country/ASN .mmdb files (geo/).
  # Back up le.db; imports/ and geo/ are re-downloaded.
  le-data:
