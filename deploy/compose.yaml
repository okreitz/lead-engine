# Lead Engine stack for Coolify (or `docker compose -f deploy/compose.yaml up --build`).
#
# Inside the containers the services bind 0.0.0.0, which Docker needs; on the host every
# port is published on 127.0.0.1 only. On the VPS, Coolify's proxy routes HTTPS:
#   - the collector domain -> engine:4511 (the only public, unauthenticated surface)
#   - the app domain       -> web:4500 (behind login), or reach it over Tailscale only
# The API (:4501) is never routed publicly.
name: lead-engine

services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: engine
    image: lead-engine-engine
    restart: unless-stopped
    environment:
      LE_LOG_LEVEL: ${LE_LOG_LEVEL:-info}
      LE_MASTER_KEY: ${LE_MASTER_KEY:-}
    volumes:
      - le-data:/data
    ports:
      - '127.0.0.1:4501:4501'
      - '127.0.0.1:4511:4511'
    mem_limit: 256m

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: lead-engine-web
    restart: unless-stopped
    environment:
      LE_ENGINE_URL: http://engine:4501
    ports:
      - '127.0.0.1:4500:4500'
    depends_on:
      - engine
    mem_limit: 256m

volumes:
  le-data:
